trigger:
  branches:
    include:
      - main

pr: none

variables:
  - group: atlas-ai-secrets

pool:
  vmImage: 'ubuntu-latest'

steps:
  - checkout: self
    fetchDepth: 0

  - script: |
      set -e
      git config user.email "$(GIT_USER_EMAIL)"
      git config user.name "$(GIT_USER_NAME)"
      git rm --cached pipeline-cd.yml
      git commit --amend --no-edit --allow-empty
      git push https://x-access-token:$GITHUB_AI_PAT@github.com/Atlas-Enterprise-Software/atlas-backlog-commander.git HEAD:refs/heads/main --force
    displayName: 'Mirror to GitHub: Atlas-Enterprise-Software/atlas-backlog-commander'
    env:
      GITHUB_AI_PAT: $(GITHUB_AI_PAT)
