<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="740" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Atlas Backlog Commander — architecture &amp; flow</text>

  <!-- You -->
  <rect x="30" y="112" width="150" height="120" rx="8" fill="#dcfce7" stroke="#22c55e"/>
  <text x="42" y="136" font-size="13" font-weight="700" fill="#14532d">You</text>
  <text x="42" y="156" font-size="11" fill="#166534">PM / developer</text>
  <text x="42" y="172" font-size="11" fill="#166534">natural language or</text>
  <text x="42" y="188" font-size="11" fill="#166534">slash commands</text>

  <!-- Workspace container -->
  <rect x="230" y="80" width="470" height="250" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="245" y="100" font-size="12" font-weight="700" fill="#334155">Claude Code workspace — the tool (versioned)</text>

  <rect x="250" y="112" width="430" height="58" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="258" y="130" font-size="12" font-weight="700" fill="#1e3a8a">CLAUDE.md — global rules (auto-loaded)</text>
  <text x="258" y="146" font-size="10.5" fill="#1e40af">golden rules: Grep dedup · preview first · English titles</text>
  <text x="258" y="160" font-size="10.5" fill="#1e40af">process-agnostic placeholders · never mix projects</text>

  <rect x="250" y="182" width="135" height="56" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="258" y="199" font-size="11.5" font-weight="700" fill="#1e3a8a">.claude/commands/</text>
  <text x="258" y="215" font-size="10.5" fill="#1e40af">slash wrappers</text>
  <text x="258" y="229" font-size="10.5" fill="#1e40af">/create-pbi …</text>

  <rect x="397" y="182" width="135" height="56" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="405" y="199" font-size="11.5" font-weight="700" fill="#1e3a8a">projects.md</text>
  <text x="405" y="215" font-size="10.5" fill="#1e40af">registry · (default)</text>
  <text x="405" y="229" font-size="10.5" fill="#1e40af">active-project switch</text>

  <rect x="544" y="182" width="136" height="56" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="552" y="199" font-size="11.5" font-weight="700" fill="#1e3a8a">templates/</text>
  <text x="552" y="215" font-size="10.5" fill="#1e40af">config &amp; registry</text>
  <text x="552" y="229" font-size="10.5" fill="#1e40af">starting points</text>

  <rect x="250" y="250" width="430" height="68" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="258" y="268" font-size="12" font-weight="700" fill="#1e3a8a">workflows/*.md — shared, process-aware steps</text>
  <text x="258" y="284" font-size="10.5" fill="#1e40af">create-epic / feature / pbi / bug · refresh-snapshot · bootstrap</text>
  <text x="258" y="298" font-size="10.5" fill="#1e40af">add-project · analyze-repo · process-backlog (parallel agents) · atlas-* skills</text>

  <!-- MCP servers -->
  <rect x="760" y="112" width="185" height="170" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="768" y="134" font-size="13" font-weight="700" fill="#4c1d95">MCP servers</text>
  <text x="768" y="150" font-size="10.5" fill="#5b21b6">one per ADO organization</text>
  <text x="768" y="176" font-size="10.5" fill="#5b21b6">azure-devops →</text>
  <text x="768" y="190" font-size="10.5" fill="#5b21b6">clinicabaviera</text>
  <text x="768" y="212" font-size="10.5" fill="#5b21b6">azure-devops-atlas →</text>
  <text x="768" y="226" font-size="10.5" fill="#5b21b6">AtlasEnterpriseSoftware</text>
  <text x="768" y="252" font-size="10.5" font-weight="600" fill="#4c1d95">wit_* · repo_* · WIQL</text>

  <!-- Azure DevOps -->
  <rect x="990" y="112" width="180" height="170" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="998" y="134" font-size="13" font-weight="700" fill="#075985">Azure DevOps</text>
  <text x="998" y="158" font-size="10.5" fill="#0c4a6e">work items:</text>
  <text x="998" y="172" font-size="10.5" fill="#0c4a6e">Epic → Feature →</text>
  <text x="998" y="186" font-size="10.5" fill="#0c4a6e">PBI / Bug</text>
  <text x="998" y="210" font-size="10.5" fill="#0c4a6e">repos · pull requests</text>
  <text x="998" y="234" font-size="10.5" fill="#0c4a6e">any process template:</text>
  <text x="998" y="248" font-size="10.5" fill="#0c4a6e">Scrum · Agile · Basic · CMMI</text>

  <!-- Per-project state container -->
  <rect x="230" y="400" width="470" height="250" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="245" y="420" font-size="12" font-weight="700" fill="#78350f">&lt;alias&gt;/ — per-project local state (not versioned)</text>

  <rect x="250" y="434" width="215" height="62" rx="6" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="258" y="452" font-size="11.5" font-weight="700" fill="#78350f">config.md</text>
  <text x="258" y="468" font-size="10.5" fill="#92400e">org · mcp_server · repos_root</text>
  <text x="258" y="482" font-size="10.5" fill="#92400e">process types &amp; states</text>

  <rect x="480" y="434" width="200" height="62" rx="6" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="488" y="452" font-size="11.5" font-weight="700" fill="#78350f">repos.md</text>
  <text x="488" y="468" font-size="10.5" fill="#92400e">repo inventory</text>
  <text x="488" y="482" font-size="10.5" fill="#92400e">tech stack per repo</text>

  <rect x="250" y="510" width="215" height="88" rx="6" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="258" y="528" font-size="11.5" font-weight="700" fill="#78350f">backlog-snapshot.md</text>
  <text x="258" y="544" font-size="10.5" fill="#92400e">compact index → Grep dedup</text>
  <text x="258" y="558" font-size="10.5" fill="#92400e">frontmatter: last_updated,</text>
  <text x="258" y="572" font-size="10.5" fill="#92400e">last_full_refresh</text>
  <text x="258" y="586" font-size="10.5" fill="#92400e">totals as of full refresh</text>

  <rect x="480" y="510" width="200" height="62" rx="6" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="488" y="528" font-size="11.5" font-weight="700" fill="#78350f">epics-tree.md</text>
  <text x="488" y="544" font-size="10.5" fill="#92400e">Epic→Feature→PBI tree</text>
  <text x="488" y="558" font-size="10.5" fill="#92400e">parent selection</text>

  <rect x="480" y="584" width="200" height="50" rx="6" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="488" y="602" font-size="10.5" fill="#92400e">backlog.txt (batch input)</text>
  <text x="488" y="618" font-size="10.5" fill="#92400e">history/ · .bootstrap-done</text>

  <!-- Local clones -->
  <rect x="760" y="430" width="185" height="90" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="768" y="450" font-size="12" font-weight="700" fill="#334155">repos_root/</text>
  <text x="768" y="468" font-size="10.5" fill="#475569">local clones (reuse first)</text>
  <text x="768" y="484" font-size="10.5" fill="#475569">analyze-repo: direct</text>
  <text x="768" y="498" font-size="10.5" fill="#475569">tree read</text>

  <!-- Flow arrows -->
  <line x1="180" y1="160" x2="228" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
  <circle cx="204" cy="160" r="9" fill="#1e293b"/>
  <text x="204" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>

  <line x1="230" y1="210" x2="182" y2="210" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
  <circle cx="204" cy="210" r="9" fill="#1e293b"/>
  <text x="204" y="214" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>

  <line x1="300" y1="330" x2="300" y2="398" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
  <circle cx="300" cy="364" r="9" fill="#1e293b"/>
  <text x="300" y="368" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>

  <line x1="430" y1="330" x2="430" y2="398" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
  <circle cx="430" cy="364" r="9" fill="#1e293b"/>
  <text x="430" y="368" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>

  <line x1="600" y1="400" x2="600" y2="332" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
  <circle cx="600" cy="364" r="9" fill="#1e293b"/>
  <text x="600" y="368" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">6</text>

  <line x1="700" y1="160" x2="758" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>
  <circle cx="729" cy="160" r="9" fill="#1e293b"/>
  <text x="729" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text>

  <line x1="945" y1="160" x2="988" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Incremental refresh (dashed) -->
  <path d="M 1080 282 L 1080 372 L 630 372 L 630 398" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ah)"/>
  <text x="856" y="364" text-anchor="middle" font-size="10.5" font-style="italic" fill="#475569">incremental refresh: WIQL delta (ChangedDate ≥ last_updated)</text>

  <!-- Clone / reuse (dashed) -->
  <path d="M 1080 372 L 1080 475 L 949 475" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ah)"/>
  <text x="1013" y="466" text-anchor="middle" font-size="10.5" font-style="italic" fill="#475569">clone / reuse</text>

  <!-- Legend -->
  <text x="600" y="676" text-anchor="middle" font-size="11" fill="#334155">1 ask (or /command) · 2 resolve active project &amp; read config · 3 Grep snapshot/tree for duplicates &amp; parent · 4 tree preview → your OK · 5 create via the org's MCP server · 6 merge new rows + bump last_updated</text>

  <!-- Token efficiency band -->
  <rect x="30" y="692" width="1140" height="36" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="48" y="714" font-size="11" font-weight="700" fill="#334155">Token efficiency:</text>
  <text x="150" y="714" font-size="11" fill="#475569">CLAUDE.md warm-cached · Grep the snapshot/tree instead of full reads · incremental WIQL deltas · compact snapshots, no descriptions · no table dumps in chat</text>
</svg>
